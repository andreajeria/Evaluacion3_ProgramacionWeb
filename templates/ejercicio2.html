
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <div class="formulario">
        <h2>Formulario de Nombres</h2>

        <form method="POST">
            <label>Nombre 1:</label>
            <input type="text" name="nombre1" required>

            <label>Nombre 2:</label>
            <input type="text" name="nombre2" required>

            <label>Nombre 3:</label>
            <input type="text" name="nombre3" required>

            <button type="submit">Enviar</button>
        </form>

        {% if nombre_mayor is defined %}
        <div class="resultado">
            <p>Nombre con más caracteres: {{ nombre_mayor }}</p>
            <p>Cantidad de caracteres: {{ cantidad }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
